<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" fill="none">

  <!-- BUILDINGS — hairline strokes, very thin -->
  <rect x="58" y="52" width="18" height="148" stroke="white" stroke-width="2"/>
  <rect x="82" y="68" width="24" height="132" stroke="white" stroke-width="2"/>

  <!-- GOLD PARALLELOGRAM — thin outline, leans right -->
  <path d="M 102 28 L 132 28 L 118 200 L 88 200 Z" stroke="#c9a87e" stroke-width="2"/>

  <!-- A — bold, clean, sharp peak -->
  <path d="M 106 200 L 168 30 L 230 200"
        stroke="white" stroke-width="30"
        stroke-linejoin="miter" stroke-miterlimit="14"
        stroke-linecap="butt"/>

  <!-- HOUSE WINDOW — small, centred in A -->
  <rect x="156" y="152" width="22" height="22" fill="#c9a87e"/>
  <line x1="167" y1="152" x2="167" y2="174" stroke="white" stroke-width="1.5"/>
  <line x1="156" y1="163" x2="178" y2="163" stroke="white" stroke-width="1.5"/>

  <!-- BASELINE -->
  <line x1="82" y1="200" x2="336" y2="200" stroke="white" stroke-width="2.5"/>

  <!-- R — bold, matches A weight -->
  <line x1="244" y1="34" x2="244" y2="200"
        stroke="white" stroke-width="16" stroke-linecap="butt"/>
  <path d="M 252 34 C 295 34 306 54 306 80 C 306 112 288 128 252 128"
        stroke="white" stroke-width="16" stroke-linecap="butt"/>
  <line x1="252" y1="128" x2="312" y2="200"
        stroke="white" stroke-width="16" stroke-linecap="butt"/>

  <!-- TEXT — single line, Cinzel-style spacing -->
  <text x="240" y="238"
        text-anchor="middle"
        font-family="Cinzel, Georgia, serif"
        font-size="26" font-weight="600"
        fill="white" letter-spacing="6">AUGUST RÅD</text>

  <!-- & in gold, BYG in white — same line -->
  <text x="240" y="270"
        text-anchor="middle"
        font-family="Cinzel, Georgia, serif"
        font-size="26" font-weight="600"
        letter-spacing="6">
    <tspan fill="#c9a87e">&amp; </tspan><tspan fill="white">BYG</tspan>
  </text>

  <!-- Thin gold line + tagline -->
  <line x1="62" y1="286" x2="148" y2="286" stroke="#c9a87e" stroke-width="1"/>
  <line x1="332" y1="286" x2="418" y2="286" stroke="#c9a87e" stroke-width="1"/>
  <text x="240" y="300"
        text-anchor="middle"
        font-family="Raleway, Arial, sans-serif"
        font-size="9.5" fill="#c9a87e" letter-spacing="4">BYGGE- OG RÅDGIVNING</text>

</svg>
